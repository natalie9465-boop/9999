
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子邀請函</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f2f0e8;
    }

    body {
      display: grid;
      place-items: center;
    }

    .invitation {
      position: relative;
      width: min(88vw, 420px);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #1f4c56;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.2);
    }

    .cover,
    .video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover {
      z-index: 2;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .video {
      z-index: 1;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .invitation.playing .cover {
      opacity: 0;
      pointer-events: none;
    }

    .invitation.playing .video {
      opacity: 1;
    }

    .open-button {
      position: absolute;
      z-index: 3;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      cursor: pointer;
      background: transparent;
    }

    .invitation.playing .open-button {
      display: none;
    }
  </style>
</head>

<body>
  <main class="invitation" id="invitation">
    <img
      class="cover"
      src="invite-cover.jpg"
      alt="電子邀請函封面"
    >

    <video
      class="video"
      id="video"
      src="invitation.mp4"
      preload="auto"
      playsinline
    ></video>

    <button
      class="open-button"
      id="openButton"
      type="button"
      aria-label="開啟電子邀請函"
    ></button>
  </main>

  <script>
    const invitation = document.getElementById("invitation");
    const video = document.getElementById("video");
    const openButton = document.getElementById("openButton");

    let opened = false;

    function openInvitation() {
      if (opened) return;

      opened = true;
      video.currentTime = 0;

      // 先播放，再切換畫面，確保保留使用者點擊手勢
      const playPromise = video.play();

      invitation.classList.add("playing");

      playPromise.catch(() => {
        opened = false;
        invitation.classList.remove("playing");
      });
    }

    function resetInvitation() {
      opened = false;
      video.pause();
      video.currentTime = 0;
      invitation.classList.remove("playing");
    }

    openButton.addEventListener("pointerdown", openInvitation);
    openButton.addEventListener("click", openInvitation);

    video.addEventListener("ended", resetInvitation);
  </script>
</body>
</html>
